[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgap"
version = "0.1.0"
description = "The Deniability Gap: a benchmark for claims an LLM implies but does not believe or defend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "litellm",
    "pyyaml",
    "python-dotenv",
    "pandas",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
